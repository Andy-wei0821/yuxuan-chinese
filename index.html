<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语萱的语文专属提升 · 深圳中考冲刺</title>
<style>
:root{
  --ink:#1d2126;
  --ink-2:#39414a;
  --muted:#7b7469;
  --paper:#f7f4ed;
  --card:#fffdf8;
  --line:#e2dcd0;
  --accent:#a8342a;
  --accent-soft:#f6e7e3;
  --green:#2f6b4f;
  --green-soft:#e6f0ea;
  --amber:#8a6a20;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;}
img{max-width:100%;height:auto;}
button{font-family:inherit;cursor:pointer;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(247,244,237,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.topbar-in{
  max-width:1080px;margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand b{font-size:16px;letter-spacing:.5px;}
.brand span{font-size:11px;color:var(--muted);letter-spacing:1px;}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
.nav button{
  border:1px solid transparent;background:none;color:var(--ink-2);
  font-size:13px;padding:6px 12px;border-radius:999px;
}
.nav button:hover{background:#efeae0;}
.nav button.on{background:var(--ink);color:#fbf8f2;border-color:var(--ink);}

.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}

/* ---------- 首页 ---------- */
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:18px 0 22px;flex-wrap:wrap;
}
.hero h1{
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:clamp(24px,4.2vw,34px);
  margin:0 0 6px;letter-spacing:1px;
}
.hero p{margin:0;color:var(--muted);font-size:13.5px;max-width:52ch;}
.stat{display:flex;gap:18px;}
.stat div{text-align:center;}
.stat b{display:block;font-size:20px;font-family:"Songti SC","SimSun",serif;}
.stat span{font-size:11px;color:var(--muted);letter-spacing:1px;}

.grid{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;transition:box-shadow .2s,transform .2s;
}
.card:hover{box-shadow:0 6px 22px rgba(60,50,35,.10);transform:translateY(-2px);}
.card .art{display:block;width:100%;height:auto;}
.thead .visual .art{display:block;width:100%;height:auto;}
.card-body{padding:12px 15px 15px;}
.card-body h3{
  margin:0 0 2px;font-family:"Songti SC","SimSun",serif;
  font-size:19px;letter-spacing:1px;
}
.card-body .meta{font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:7px;}
.card-body .one{font-size:12.5px;color:var(--ink-2);min-height:38px;}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.chip{
  font-size:11px;padding:2px 8px;border-radius:999px;
  background:#f1ece2;color:var(--muted);border:1px solid #e7e0d3;
}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:#cfe0d6;}

/* ---------- 篇目页 ---------- */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.crumb a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line);cursor:pointer;}
.crumb a:hover{color:var(--accent);}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tabs button{
  background:none;border:none;padding:10px 15px;font-size:14px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

.thead{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;}
.thead .visual{flex:1 1 380px;min-width:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.thead .info{flex:1 1 260px;min-width:0;}
.thead h2{margin:0 0 4px;font-family:"Songti SC","SimSun",serif;font-size:26px;letter-spacing:2px;}
.thead .sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}
.thead .idea{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:10px;}

/* 原文 */
.para{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:14px;
}
.para .txt{
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;line-height:2.15;letter-spacing:.6px;margin:0;
}
.para .txt .s{cursor:pointer;border-radius:3px;padding:1px 0;transition:background .15s;}
.para .txt .s:hover{background:#f3ece0;}
.para .txt .s.speaking{background:#fbe9c9;box-shadow:inset 0 -2px 0 #d9a441;}
.para .note{
  margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.85;
}
.para .note b{color:var(--ink-2);font-weight:600;}
.pbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:12.5px;padding:7px 14px;border-radius:999px;transition:all .15s;
}
.btn:hover{border-color:#c9c0b0;background:#faf7f0;}
.btn.primary{background:var(--ink);color:#fbf8f2;border-color:var(--ink);}
.btn.primary:hover{background:#2c333b;}
.btn.ghost{background:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.rate{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-left:auto;}
.rate input{width:110px;accent-color:var(--accent);}
.vcard{border:1px solid var(--line);border-radius:12px;background:#fbfaf6;padding:12px 14px;margin:10px 0 14px;font-size:12.5px;line-height:1.9;}
.vcard[hidden]{display:none;}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0;}
.vrow>b{flex:0 0 76px;color:var(--muted);font-weight:600;}
.vcard select{flex:1;min-width:0;max-width:100%;font:inherit;font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
.vt{color:var(--accent);font-size:11.5px;background:#fdf3f0;border-radius:6px;padding:1px 6px;font-style:normal;}
.vnote{margin:8px 0 0;padding:8px 10px;background:#f4f7f2;border-radius:8px;color:#4a5a4e;font-size:11.5px;line-height:1.85;}
.vdet{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
.vdet summary{cursor:pointer;font-weight:600;color:var(--ink);padding:6px 0;}
.vbody{padding:4px 0 0;}
.vh{margin:7px 0;color:var(--muted);font-size:12px;line-height:1.95;}
.vh b{color:var(--ink);}
.vcard a[href]{color:var(--accent);word-break:break-all;}
.hint{
  font-size:12px;color:var(--amber);background:#fdf6e6;border:1px solid #f0e2be;
  padding:8px 12px;border-radius:8px;margin-bottom:14px;
}

/* 默写 */
.ditem{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:12px;
}
.ditem .src{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.ditem .line{
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;line-height:2.2;letter-spacing:.5px;
}
.ditem input{
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;color:var(--accent);
  border:none;border-bottom:1.5px solid #cfc6b6;background:#fbf8f1;
  padding:2px 6px;min-width:200px;width:min(100%,360px);text-align:center;letter-spacing:1px;
}
.ditem input:focus{outline:none;border-bottom-color:var(--accent);background:#fffdf6;}
.ditem.right{border-color:#cfe0d6;background:#fcfdfb;}
.ditem.wrong{border-color:#eccfc9;background:#fdfaf9;}
.verdict{margin-top:9px;font-size:12.5px;line-height:1.9;}
.verdict .ok{color:var(--green);}
.verdict .no{color:var(--accent);}
.verdict .fix b{color:var(--accent);font-family:"Songti SC","SimSun",serif;font-size:15px;}
.chr{border-radius:2px;padding:0 1px;}
.chr.bad{background:#f7d9d4;color:var(--accent);text-decoration:line-through;}

/* 练习 */
.q{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:14px;
}
.q .qh{display:flex;gap:8px;align-items:baseline;margin-bottom:10px;}
.q .no{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px;}
.q .ask{font-size:14.5px;line-height:1.85;flex:1;}
.q .pt{font-size:11px;color:var(--muted);white-space:nowrap;}
.opt{
  display:block;width:100%;text-align:left;background:#fbf8f1;border:1px solid var(--line);
  border-radius:8px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.7;
  color:var(--ink-2);transition:all .15s;
}
.opt:hover{border-color:#cdc3b2;background:#f8f4ea;}
.opt.pick{border-color:var(--ink);background:#f2ece0;}
.opt.good{border-color:#8fbca6;background:var(--green-soft);color:var(--green);}
.opt.bad{border-color:#e0a79e;background:var(--accent-soft);color:var(--accent);}
.opt .k{font-weight:700;margin-right:8px;}
textarea{
  width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-family:inherit;font-size:13.5px;line-height:1.8;
  background:#fbf8f1;color:var(--ink);resize:vertical;
}
textarea:focus{outline:none;border-color:var(--accent);background:#fffdf6;}
.refbox{
  margin-top:10px;background:#f4f7f4;border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;padding:11px 14px;font-size:13px;line-height:1.9;color:var(--ink-2);
}
.refbox .t{font-weight:600;color:var(--green);display:block;margin-bottom:4px;letter-spacing:1px;}
.selfpt{display:block;font-size:12.5px;color:var(--ink-2);margin:4px 0;}
.selfpt input{margin-right:7px;accent-color:var(--green);}

/* 结果条 */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;margin-bottom:18px;position:sticky;top:53px;z-index:9;
}
.bar .sc{font-family:"Songti SC","SimSun",serif;font-size:22px;letter-spacing:1px;}
.bar .sc small{font-size:12px;color:var(--muted);letter-spacing:0;}
.bar .grow{flex:1;}

/* 错字本 */
.wgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));}
.wcell{
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  text-align:center;padding:10px 6px;
}
.wcell b{display:block;font-family:"Songti SC","SimSun",serif;font-size:28px;color:var(--accent);line-height:1.25;}
.wcell span{font-size:11px;color:var(--muted);}
.empty{
  text-align:center;color:var(--muted);font-size:13px;padding:44px 0;
  border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.4);
}

/* ---------- 答题公式 ---------- */
.kn{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:18px 20px;margin-bottom:16px;
}
.kn-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;}
.kn-h h3{margin:0;font-family:"Songti SC","SimSun",serif;font-size:21px;letter-spacing:1.5px;}
.kn-w{font-size:11px;color:#fff;background:var(--accent);padding:2px 8px;border-radius:4px;letter-spacing:1px;}
.kn-sub{font-size:12px;color:var(--muted);margin-left:auto;}
.kn-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;}
.kn-t{
  flex:0 0 66px;font-size:11.5px;color:var(--muted);letter-spacing:1px;
  padding-top:3px;border-right:1px solid var(--line);padding-right:10px;
}
.kn-list{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.kn-list.col{flex-direction:column;gap:5px;}
.sig{font-size:12px;background:#f3efe5;border:1px solid #e6dfd0;color:var(--ink-2);padding:3px 9px;border-radius:6px;}
.trap{font-size:12.5px;color:var(--ink-2);line-height:1.75;padding-left:14px;position:relative;}
.trap::before{content:"×";position:absolute;left:0;top:0;color:var(--accent);font-weight:700;}
.kn-steps{flex:1;display:flex;flex-direction:column;gap:6px;}
.step{display:flex;gap:8px;font-size:13px;line-height:1.7;color:var(--ink-2);}
.step i{
  flex:0 0 19px;height:19px;border-radius:50%;background:var(--ink);color:#fbf8f2;
  font-size:11px;font-style:normal;text-align:center;line-height:19px;margin-top:2px;
}
.kn-tpl{
  margin:0;font-size:14.5px;line-height:1.95;color:var(--ink);
  background:#f7f3e8;border-left:3px solid var(--accent);padding:9px 13px;border-radius:0 8px 8px 0;
}
.kndemo{background:#f6f8f5;border:1px solid #e2eae2;border-radius:9px;padding:13px 15px;margin-top:14px;}
.knd-q{font-size:13.5px;line-height:1.9;color:var(--ink-2);}
.knd-ask{font-size:13px;color:var(--ink);margin:8px 0 10px;font-weight:600;}
.kndemo details summary{
  font-size:12.5px;color:var(--green);cursor:pointer;letter-spacing:.5px;
  list-style:none;display:inline-block;padding:4px 12px;border:1px solid #cfe0d6;border-radius:999px;background:#fff;
}
.kndemo details summary::-webkit-details-marker{display:none;}
.knd-ref{font-size:13px;line-height:1.95;color:var(--ink-2);margin-top:9px;padding-left:2px;}
.kb{
  font-size:11px;color:var(--accent);background:var(--accent-soft);
  border:1px solid #eed6d0;padding:1px 7px;border-radius:999px;cursor:pointer;
  white-space:nowrap;margin-left:6px;
}
.kb:hover{background:#f2ddd7;}
.band{margin-top:26px;}
.band h2{font-family:"Songti SC","SimSun",serif;font-size:18px;letter-spacing:1px;margin:0 0 4px;}
.band p{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
.kbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.kbc{
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;cursor:pointer;
  transition:all .15s;
}
.kbc:hover{border-color:#c9c0b0;background:#fdfaf3;}
.kbc b{display:block;font-size:14px;margin-bottom:3px;}
.kbc span{font-size:11.5px;color:var(--muted);}

/* ---------- 阅读专练 ---------- */
.passage{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px 20px;margin-bottom:16px;
}
.passage .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px;}
.passage .ph b{font-family:"Songti SC","SimSun",serif;font-size:18px;letter-spacing:1px;}
.passage .ph span{font-size:11.5px;color:var(--muted);}
.passage p{
  font-size:15px;line-height:2.05;color:var(--ink);margin:0 0 9px;text-indent:2em;
}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.9;}

/* ---------- 真题实战 ---------- */
.eart{padding:0 4px;}
.eart svg{width:100%;height:auto;display:block;border-radius:8px 8px 0 0;}
.stbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.stbl th{font-family:"Songti SC","SimSun",serif;white-space:nowrap;text-align:left;padding:9px 14px;background:rgba(138,106,32,.07);color:#8a6a20;border-bottom:1px solid var(--line);vertical-align:top;font-weight:700;}
.stbl td{padding:9px 14px;line-height:1.9;color:var(--ink);border-bottom:1px solid var(--line);}
.srcs{list-style:none;margin:8px 0 0;padding:0;}
.srcs li{padding:5px 0;border-bottom:1px dashed var(--line);}
.srcs a{color:#2a5a8a;text-decoration:none;border-bottom:1px solid rgba(42,90,138,.3);}
.srcs a:hover{border-bottom-color:#2a5a8a;}

/* ---------- 讲读点睛 ---------- */
.jdsec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px;}
.jdsec h4{font-family:"Songti SC","SimSun",serif;font-size:15.5px;letter-spacing:2px;color:#8a6a20;margin:0 0 8px;padding-bottom:7px;border-bottom:1px dashed var(--line);}
.jdsec p.jd-t{font-size:14.5px;line-height:2.05;color:var(--ink);margin:0;text-indent:2em;}
.jdsec p.jd-t .s{cursor:pointer;border-radius:3px;padding:1px 2px;transition:background .2s;}
.jdsec p.jd-t .s:hover{background:rgba(138,106,32,.08);}
.jdsec p.jd-t .s.speaking{background:rgba(138,106,32,.16);}

@media (max-width:640px){
  .wrap{padding:16px 13px 48px;}
  .thead{flex-direction:column;}
  .para .txt{font-size:16px;line-height:2;}
  .nav{margin-left:0;width:100%;}
  .bar{position:static;}
  .rate{width:100%;margin-left:0;}
  .vrow>b{flex:0 0 100%;}
  .vcard select{width:100%;}
  .vdet summary{font-size:13px;}
  .vh{font-size:12.5px;}
}
/* ---------- 爸爸的寄语 ---------- */
.dadcard{
  background:linear-gradient(135deg,#fdf8ef 0%,#f6ede0 55%,#efe3d3 100%);
  border:1px solid #e6d9c4;border-radius:14px;
  padding:20px 22px 16px;margin-bottom:20px;position:relative;overflow:hidden;
}
.dadcard:before{
  content:'寄';position:absolute;right:14px;top:6px;font-size:clamp(40px,9vw,64px);
  font-family:"Songti SC","SimSun",serif;color:rgba(168,52,42,.07);
}
.dadcard h2{
  margin:0 0 10px;font-family:"Songti SC","SimSun",serif;
  font-size:17px;letter-spacing:2px;color:#8a5a20;
}
.dadcard .dadtxt{
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:15px;line-height:2;color:var(--ink-2);margin:0;
  white-space:pre-line;
}
.dadcard .dadsign{
  text-align:right;color:#a08650;font-size:13px;margin-top:8px;letter-spacing:1px;
}
.dadcard .count{
  display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;
  background:rgba(168,52,42,.08);color:var(--accent);font-size:12.5px;letter-spacing:.5px;
}

/* ---------- 阅读专练·名师点拨 ---------- */
.tipbox{
  margin:8px 0;padding:10px 12px;border-radius:8px;
  background:#f3f6f1;border:1px dashed #cfdec9;
  font-size:12.5px;color:#3c5747;line-height:1.8;
}
.tipbox b{color:#2f6b4f;letter-spacing:1px;}

/* ---------- 学情诊断 ---------- */
.diag-bar{margin:10px 0 4px;}
.diag-bar .row{display:flex;align-items:center;gap:8px;margin:7px 0;}
.diag-bar .lb{flex:0 0 128px;font-size:12.5px;color:var(--ink-2);}
.diag-bar .tr{flex:1 1 auto;height:10px;border-radius:5px;background:#eee7da;overflow:hidden;}
.diag-bar .fl{height:100%;border-radius:5px;background:linear-gradient(90deg,#2f6b4f,#5a8f70);}
.diag-bar .fl.bad{background:linear-gradient(90deg,#a8342a,#c96a52);}
.diag-bar .pc{flex:0 0 52px;text-align:right;font-size:12px;color:var(--muted);}
.diag-step{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;margin:10px 0;
}
.diag-step i{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fbf8f2;
  font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;
}
.diag-step h4{margin:0 0 3px;font-size:14px;}
.diag-step p{margin:0;font-size:12.5px;color:var(--ink-2);}
.diag-step p b{color:var(--accent);}
.wchip{

  paras:[
    {p:'唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。',n:'机杼：织布机。军帖：征兵文书。可汗：西北民族对君主的称呼。十二卷：虚数，言其多。爷：父亲。句意：木兰对着门织布，听不到织机声，只听到叹息。原来军书频传、父亲在册，家中无长兄，她决心买鞍马替父出征。'},
    {p:'东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。',n:'鞍鞯：马鞍下的垫子。辔头：驾马的笼头。溅溅、啾啾：拟声词。句意：四处置办出征装备（互文），清晨告别爷娘奔赴黄河，暮宿河边只听流水悲鸣；再别黄河，暮至黑山，只闻敌骑嘶鸣。'},
    {p:'万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。',n:'戎机：战事。金柝：军中打更器具。策勋：记功。转：勋级。强：有余。句意：万里奔赴战场，关山如飞掠过；北风传送打更声，寒月映照铁甲；将军身经百战死，壮士十年得胜归。天子记功行赏，木兰辞官不就，只求快马还乡。'},
    {p:'爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？',n:'扶将：搀扶。霍霍：磨刀声。帖：同“贴”。火伴：同伍的士兵。扑朔、迷离：一动一静，难以分辨。句意：全家喜迎木兰还乡；木兰重着旧妆，同伴惊觉同行十二年竟不知她是女郎。末以双兔为喻：奔跑起来，怎能分辨雄雌？——机智幽默地收束全诗。'}

    {p:'俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！',n:'俄顷：一会儿。布衾：布被。丧乱：安史之乱。彻：到天亮。突兀：高耸的样子。句意：一会儿风停云黑，秋雨漠漠天色昏暗；布被多年冷硬如铁，孩子睡相不好蹬破了被里；屋顶漏雨床上无干处，雨点密如麻下个不停。自经战乱我已少眠，长夜湿冷如何挨到天亮！怎么才能得到千万间宽敞的大屋，庇护天下贫寒的读书人都露出笑颜，风雨不动安稳如山！唉，若眼前真出现这样的房子，唯独我的茅屋破、受冻而死也心甘！'}

p5dy:{bg:'明洪武年间，宋濂告老还乡后写给同乡青年马君则的赠序，以自身求学之艰勉励后学。',

g1gc:{bg:'建安十二年，曹操北征乌桓得胜回师，途经碣石山，登山观海而作。时年五十三岁，正踌躇满志。',

   {t:'文言文对比阅读：甲《桃花源记》（节选）+ 乙 明·屠隆《在京与友人书》（节选）',
    mat:'甲文为本站收录的《桃花源记》节选（从“林尽水源”到“不足为外人道也”）。乙文（节选）：写京城骑马“风起飞尘满衢陌”“两鼻孔黑如烟突”的狼狈，转而“遥想江村夕阳，渔舟投浦，返照入林，沙明如雪；花下晒网罟，酒家白板青帘，掩映垂柳，老翁挈鱼提瓮出柴门”，末句“绝胜长安骑马冲泥也”。注：罟（gǔ）＝捕鱼的网。',
    items:[
     {type:'choice',q:'甲文加点词语中，最适合填入乙文“百姓窜▲不及”的是：',opts:['通（才通人）','还（便要还家）','避（避秦时乱）','延（延至其家）'],a:2,
      exp:'“窜避不及”＝来不及躲避；“避秦时乱”的“避”＝躲避。A通＝通过，B还＝返回，D延＝邀请，均不合语境——答案C。这类题考课内实词向课外的迁移，逐一代入检验。'},
     {type:'open',q:'翻译：①咸来问讯。　②沙明如雪。',ref:'①（村里的人）都来打听消息。②沙滩（明净得）像雪一样（洁白）。',
      exp:'①“咸”＝都（课内“咸来问讯”原句），要补出主语“村人”；②“明”“如雪”直译即可，比喻保留。'},
     {type:'open',q:'甲、乙两文描绘的乡村生活，都富有人情之美。请结合内容简要分析。',ref:'桃花源中人们自给自足、和平恬静：设酒杀鸡、咸来问讯、各复延至其家，见民风淳朴热忱；屠隆笔下的江村老翁挈鱼提瓮、酒家垂柳掩映，见生活安然自得。两文都写出了没有尘嚣倾轧、邻里相安的淳朴人情。',
      exp:'“比较分析”题必须两文都举出原文细节，再归结到共同点（淳朴/恬静/人情味），单写一篇丢一半分。'},
     {type:'open',q:'对话补空：小语说，陶渊明想借“桃花源”表达（1）______；小文说，范仲淹“进亦忧，退亦忧”告诉我们（2）______。',ref:'（1）他的社会（政治）理想：没有压迫战乱、人人安居乐业、自给自足的理想社会。（2）身在朝廷要为百姓忧虑，退处江湖也要为国事担忧——无论自身处境如何，都要关心国计民生。',
      exp:'（1）考主旨概括，答案须含“理想社会”与两层特征（无压迫战乱/安居乐业）；（2）考《岳阳楼记》名句理解，“进”“退”两个境遇都要覆盖。'}

     req:['不少于600字、不超过900字','除诗歌外文体不限','不能出现真实校名人名（如须出现用XXX代替）'],
     jl:'题眼拆解：“看”＝要有观察的主体视角与过程；“风景”宜虚不宜实——卓越教育明确提示：狭义的“自然景色”比较肤浅，风景可以是人、是事、是城市与人心的变化；“在变”＝必须写出“变化的过程”（前后对比），并落到自身成长。导语已把可选角度全给你：自然四季→少年成长→科技发展→社会风貌，任选一条线写“我看到的变”。',
     ming:'名师点评摘录——卓越教育中考语文研究团队（深圳新闻网）：考查关键词为“变”，属于成长类作文；如何在文中展示风景的变化过程，是得分的关键。参考立意：①在风景变化中个人能力增强；②变化带来的独特体验与感悟；③自我的发展影响了他人、为社会做出贡献。梁芳（南科大附罗湖中学语文科组长）：整张试卷围绕“变”完成思维闭环，作文是这套闭环的最后一块——由所学所见，到所悟所思。',
     ly:['深圳的“风景”：城中村变美术馆、海边变绿道、老街变文化街区——“我”骑车穿行看见的城市更新。','人的“风景”：环卫工阿姨风雨十年，马路从她用扫帚画到机器人协同——变的是工具，不变的是人。','自我的“风景”：从讨厌跑步到爱上夜跑，同一条路四季不同——变的是我的心。']
   }}
  ]

   {t:'文言文对比阅读：甲《咏雪》+ 乙《孔子家语·子路见孔子》',
    mat:'甲文＝本站七上《咏雪》全文。乙文（节选）：子路以“好长剑”答孔子，认为“学岂益哉”；孔子以“木受绳则直，人受谏则圣”“毁仁者必主于刑”层层开导，又以“括而羽之，镞而砺之，其入不益深乎”作结，子路“拜曰：敬受教”。（括：箭的末端；镞：箭头；砺：磨。）',

      exp:'①“未若”＝不如、“因”＝趁、乘，直译即可；②“何……之有”是宾语前置的固定反问句式（何陋之有同类），翻译要还原成“有何学”，并译出反问语气。'},
     {type:'open',q:'甲文“无言之教”、乙文“有言之教”都取得了良好效果，请具体说一说。',ref:'甲文谢安面对孩子两个高下立判的比喻只“大笑乐”，不加评断——这种不轻下结论的含蓄，本身就是对子侄的肯定与包容，是“无言之教”；乙文孔子以身边之物设喻（木受绳、箭加羽砺），层层类比、循循善诱，终于让子路心悦诚服地“敬受教”，是“有言之教”。两文殊途同归：教育贵在启发而不在灌输。',
      exp:'课内外勾连评价题。要点：①分别概括两文“教”的方式（甲：不置可否的笑＝含蓄肯定；乙：设喻类比）；②落到“效果好”的落点（大笑乐之乐、子路拜服）；③有比较意识（殊途同归/异曲同工）——阅卷时这三个层次各自占分。'},

      exp:'意象角色题：不要只答“景物”，要答出明月被赋予的功能（陪伴者/传递者），并结合“随君直到夜郎西”这一句作证。'}

function pg(id){if(!store.prog[id]){store.prog[id]={read:false,dict:0,dictTotal:6,quiz:0,quizTotal:6};}return store.prog[id];}
function escapeHtml(s){
  var out=String(s);
  var dq=String.fromCharCode(34), sq=String.fromCharCode(39);
  out=out.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  out=out.split(dq).join('&quot;').split(sq).join('&#39;');
  return out;
}
/* 统一挂载：用片段解析代替 innerHTML 赋值，避免字符串直接写入 DOM */
function mount(el,html){
  if(!el) return;
  var r=document.createRange();
  r.selectNodeContents(el);
  el.textContent='';
  el.appendChild(r.createContextualFragment(html));
}
function norm(s){
  return String(s).replace(/[\s\u3000，。？！；：、“”‘’\x22\x27（）()《》·,\.!?;:]/g,'');
}

/* ------------------------------------------------------------
   教材明确注释的通假异读。朗读时临时替换为同音字，只改读音不改显示。
   例：不亦说乎 → 不亦悦乎（说通悦，读 yuè）
   ------------------------------------------------------------ */
var TTS_FIX=[
['不亦说乎','不亦悦乎'],['属予作文','嘱予作文'],['矜、寡','鳏、寡'],
['河曲智叟亡以应','河曲智叟无以应'],['八分有奇','八分又奇'],
['选贤与能','选贤举能'],['食马者','饲马者'],
['食之不能尽其材','饲之不能尽其才'],['才美不外见','才美不外现'],
['其真无马邪','其真无马耶'],['四支僵劲','四肢僵劲'],['同舍生皆被绮绣','同舍生皆披绮绣'],
['曾益其所不能','增益其所不能'],['衡于虑','横于虑'],
['法家拂士','法家弼士'],['有所不辟','有所不避'],['不辩礼义','不辨礼义'],
['二十有一年','二十又一年'],
['翩翩两骑','翩翩两技'],['千骑卷平冈','千技卷平冈'],['突兀见此屋','突兀现此屋'],
['著我旧时裳','着我旧时裳'],['胡骑鸣啾啾','胡技鸣啾啾'],
['浑欲不胜簪','浑欲不生簪'],['马作的卢','马作迪卢'],['八月秋高风怒号','八月秋高风怒嚎'],
['都护铁衣冷难着','都护铁衣冷难酌']
];
function fixPron(s){
  var r=String(s);
  for(var i=0;i<TTS_FIX.length;i++){
    if(r.indexOf(TTS_FIX[i][0])>=0) r=r.split(TTS_FIX[i][0]).join(TTS_FIX[i][1]);
  }
  return r;
}
/* 按标点切成小段，句末留白 ------ 古文的“韵味”主要靠停出来的 */
function ttsChunks(s){
  var raw=String(s).replace(/[\s\u3000]+/g,'');
  var out=[], buf='';
  for(var i=0;i<raw.length;i++){
    var c=raw.charAt(i);
    buf+=c;
    if('，、'.indexOf(c)>=0){ if(buf.length>1) out.push({t:buf,p:240}); buf=''; }
    else if('：；'.indexOf(c)>=0){ if(buf.length>1) out.push({t:buf,p:330}); buf=''; }
    else if('。！？'.indexOf(c)>=0){ if(buf.length>1) out.push({t:buf,p:470}); buf=''; }
  }
  var tail=buf.replace(/[，。、？！；：]/g,'');
  if(tail) out.push({t:tail,p:0});
  return out;
}
/* 音色打分：优先在线 / Natural / Neural；云扬=新闻播报感最强 */
function voiceScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');
  var l=(v.lang||'').toLowerCase();
  var s=0;
  if(!v.localService) s+=30;
  if(/online/i.test(n)) s+=18;
  if(/natural/i.test(n)) s+=18;
  if(/neural/i.test(n)) s+=10;
  if(/xiaoxiao|晓晓/i.test(n)) s+=16;
  if(/yunyang|云扬/i.test(n)) s+=15;
  if(/yunxi|云希/i.test(n)) s+=12;
  if(/yunxia|云夏/i.test(n)) s+=6;
  if(/xiaoyi|晓伊/i.test(n)) s+=8;
  if(/增强|高音质|premium|enhanced|siri/i.test(n)) s+=16;
  if(l.indexOf('zh-cn')===0) s+=8;
  else if(l.indexOf('zh-tw')===0||l.indexOf('zh-hk')===0) s-=30;
  else if(l.indexOf('zh-yue')===0) s-=40;
  return s;
}
function voiceTag(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');
  var t=[];
  if(v.localService) t.push('离线'); else t.push('在线');
  if(/natural|neural|online/i.test(n)) t.push('自然度高');
  if(/xiaoxiao|晓晓/i.test(n)) t.push('女声·播报首选');
  if(/yunyang|云扬/i.test(n)) t.push('男声·新闻播报');
  if(/yunxi|云希/i.test(n)) t.push('男声·亲和');
  if(/yunxia|云夏/i.test(n)) t.push('少年男声');
  if(/xiaoyi|晓伊/i.test(n)) t.push('女声·轻快');
  if(/增强|premium|enhanced/i.test(n)) t.push('高音质');
  if(!t.length) t.push('系统默认');
  return t.join(' · ');
}
function listZhVoices(){
  if(!('speechSynthesis' in window)) return [];
  var vs=speechSynthesis.getVoices()||[], out=[];
  for(var i=0;i<vs.length;i++){
    var l=(vs[i].lang||'').toLowerCase().replace(/_/g,'-');
    if(l.indexOf('zh')===0||l.indexOf('cmn')===0) out.push(vs[i]);
  }
  out.sort(function(a,b){return voiceScore(b)-voiceScore(a);});
  return out;
}
function storeTts(k,v){
  if(!store.tts) store.tts={};
  store.tts[k]=v; save();
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var vs=listZhVoices();
  if(!vs.length){zhVoice=null;return;}
  var want=(store.tts&&store.tts.v)?store.tts.v:'';
  zhVoice=vs[0];
  for(var i=0;i<vs.length;i++){
    if(vs[i].voiceURI===want){zhVoice=vs[i];break;}
  }
  if(store.tts){
    if(store.tts.rate){var r=parseFloat(store.tts.rate); if(r>=0.5&&r<=1.4) rate=r;}
    if(store.tts.pause){var p=parseFloat(store.tts.pause); if(p>=0&&p<=3) pauseK=p;}
  }
}
if('speechSynthesis' in window){
  try{ pickVoice(); }catch(e){}
  try{ speechSynthesis.onvoiceschanged=function(){pickVoice();}; }catch(e){}
}
function stopSpeak(){
  speakToken++;
  speaking=false;
  if(seqTimer){clearTimeout(seqTimer);seqTimer=null;}
  if('speechSynthesis' in window){
    try{speechSynthesis.cancel();}catch(e){}
  }
  var els=document.querySelectorAll('.s.speaking');
  for(var i=0;i<els.length;i++) els[i].classList.remove('speaking');
}
function speakSeq(items,cb,tk){
  if(tk!==speakToken||!speaking) return;
  if(!items.length){ if(cb) cb(); return; }
  var it=items.shift();
  if(!it||!it.t){ speakSeq(items,cb,tk); return; }
  if('speechSynthesis' in window){ try{speechSynthesis.resume();}catch(e){} }
  var u=new SpeechSynthesisUtterance(it.t);
  u.lang='zh-CN'; u.rate=rate; u.pitch=1; u.volume=1;
  if(zhVoice) u.voice=zhVoice;
  u.onend=function(){
    if(tk!==speakToken) return;
    if(it.p>0) seqTimer=setTimeout(function(){speakSeq(items,cb,tk);},Math.round(it.p*pauseK));
    else speakSeq(items,cb,tk);
  };
  u.onerror=function(){ if(tk===speakToken) speakSeq(items,cb,tk); };
  try{ speechSynthesis.speak(u); }catch(e){ speakSeq(items,cb,tk); }
}
function speakList(els,idx){
  if(!speaking) return;
  if(idx>=els.length){speaking=false;return;}
  var tk=speakToken;
  var el=els[idx];
  el.classList.add('speaking');
  try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
  var items=ttsChunks(fixPron(el.textContent));
  speakSeq(items,function(){
    if(tk!==speakToken||!speaking) return;
    el.classList.remove('speaking');
    speakList(els,idx+1);
  },tk);
}
function speakOne(el){ stopSpeak(); speaking=true; speakList([el],0); }
function sampleVoice(uri){
  stopSpeak();
  var vs=listZhVoices(), v=null;
  for(var i=0;i<vs.length;i++){ if(vs[i].voiceURI===uri) v=vs[i]; }
  var u=new SpeechSynthesisUtterance('先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。');
  u.lang='zh-CN'; u.rate=rate; u.pitch=1;
  if(v) u.voice=v; else if(zhVoice) u.voice=zhVoice;
  try{ speechSynthesis.speak(u); }catch(e){}
}

function panelDict(t){
  var p=pg(t.id);
  var h='<div class="bar"><div class="sc"><span id="dscore">'+p.dict+'</span><small> / '+t.dict.length+' 句</small></div>'
   +'<div class="grow"></div>'
   +'<button type="button" class="btn primary" id="checkAll">判分</button>'
   +'<button type="button" class="btn" id="showAll">显示答案</button>'
   +'<button type="button" class="btn ghost" id="resetAll">重做</button></div>';
  h+='<div class="hint">按原文逐字填写，标点可不写。判分后，写错的字会以红框标出并显示正确写法，同时自动记进错字本。</div>';
  for(var i=0;i<t.dict.length;i++){
    var d=t.dict[i];
    h+='<div class="ditem" id="di-'+i+'"><div class="src">第 '+(i+1)+' 题　'+escapeHtml(d.src)+'</div>'
     +'<div class="line serif">'+escapeHtml(d.pre)
     +'<input type="text" id="in-'+i+'" autocomplete="off" placeholder="填入所缺句子">'
     +escapeHtml(d.post)+'</div><div class="verdict" id="vd-'+i+'"></div></div>';
  }
  mount(document.getElementById('panel'),h);

  document.getElementById('checkAll').onclick=function(){
    var right=0;
    for(var i=0;i<t.dict.length;i++){
      var d=t.dict[i];
      var inp=document.getElementById('in-'+i);
      var v=inp.value;
      var ok=norm(v)===norm(d.ans);
      var box=document.getElementById('di-'+i);
      var vd=document.getElementById('vd-'+i);
      box.className='ditem '+(ok?'right':'wrong');
      if(ok){
        right++;
        mount(vd,'<span class="ok">✓ 正确</span>');
      }else{
        var ua=norm(v).split(''), ca=norm(d.ans).split('');
        var cmp='';
        for(var c=0;c<ca.length;c++){
          if(ua[c]===ca[c]) cmp+=escapeHtml(ca[c]);
          else cmp+='<span class="chr bad">'+escapeHtml(ca[c])+'</span>';
        }
        mount(vd,'<span class="no">✗ 有误</span>　正确写法：<span class="fix"><b>'+cmp+'</b></span>');
        for(var c2=0;c2<ca.length;c2++){
          if(ua[c2]!==ca[c2]){addWrong(ca[c2],t.title);}
        }
      }
    }
    p.dict=right;save();
    document.getElementById('dscore').textContent=right;
    if(right===t.dict.length){
      var vd0=document.getElementById('vd-0');
      if(vd0) vd0.insertAdjacentHTML('beforeend','<span class="ok">　本篇默写全对。</span>');
    }
  };
  document.getElementById('showAll').onclick=function(){
    for(var i=0;i<t.dict.length;i++){
      document.getElementById('in-'+i).value=t.dict[i].ans;
    }
  };
  document.getElementById('resetAll').onclick=function(){
    for(var i=0;i<t.dict.length;i++){
      document.getElementById('in-'+i).value='';
      document.getElementById('vd-'+i).innerHTML='';
      document.getElementById('di-'+i).className='ditem';
    }
    p.dict=0;save();document.getElementById('dscore').textContent='0';
  };
}

function addWrong(ch,src){
  if(!ch||norm(ch)==='') return;
  if(!store.wrong[ch]) store.wrong[ch]={n:0,src:src};
  store.wrong[ch].n=(store.wrong[ch].n||0)+1;
  if(src) store.wrong[ch].src=src;
  save();
}

function panelQuiz(t){
  var p=pg(t.id);
  var total=0;
  for(var i=0;i<t.quiz.length;i++) total+=t.quiz[i].score;
  var h='<div class="bar"><div class="sc"><span id="qscore">'+p.quiz+'</span><small> / '+total+' 分</small></div>'
   +'<div class="grow"></div><button type="button" class="btn ghost" id="resetQ">重做</button></div>';
  h+='<div class="hint">选择题自动判分并给解析；简答题先自己写，再点“对答案”，按要点勾选自评。</div>';
  for(var k=0;k<t.quiz.length;k++){
    var q=t.quiz[k], n=k+1;
    var kbId=kbFor(t,k);
    var kbObj=kbId?findKn(kbId):null;
    h+='<div class="q" id="q-'+k+'"><div class="qh"><span class="no">第 '+n+' 题</span>'
     +(kbObj?'<span class="kb" data-kb="'+kbObj.id+'">考点 · '+escapeHtml(kbObj.title)+'</span>':'')
     +'<span class="ask">'+escapeHtml(q.q)+'</span><span class="pt">'+q.score+' 分</span></div>';
    if(q.type==='choice'){
      for(var o=0;o<q.opts.length;o++){
        h+='<button type="button" class="opt" data-q="'+k+'" data-o="'+o+'"><span class="k">'
         +String.fromCharCode(65+o)+'．</span>'+escapeHtml(q.opts[o])+'</button>';
      }
      h+='<div id="fb-'+k+'"></div>';
    }else{
      h+='<textarea id="ta-'+k+'" placeholder="按点作答，尽量用原文关键词……"></textarea>'
       +'<div class="pbar" style="margin-top:10px"><button type="button" class="btn primary" data-ref="'+k+'">对答案</button></div>'
       +'<div id="fb-'+k+'"></div>';
    }
    h+='</div>';
  }
  mount(document.getElementById('panel'),h);

  var kbs=document.querySelectorAll('[data-kb]');
  for(var kk=0;kk<kbs.length;kk++){
    kbs[kk].onclick=function(){
      var kid=this.getAttribute('data-kb');
      stopSpeak();view.name='kn';view.id=null;render();
      var el=document.getElementById('kn-'+kid);
      if(el){try{el.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}}
    };
  }

  var opts=document.querySelectorAll('[data-q]');
  for(var m=0;m<opts.length;m++){
    opts[m].onclick=function(){
      var qi=parseInt(this.getAttribute('data-q'),10), oi=parseInt(this.getAttribute('data-o'),10);
      var q=t.quiz[qi], box=this.parentNode;
      var all=box.querySelectorAll('.opt');
      for(var z=0;z<all.length;z++){all[z].classList.remove('pick');all[z].classList.remove('good');all[z].classList.remove('bad');}
      this.classList.add('pick');
      var fb=document.getElementById('fb-'+qi);
      if(oi===q.a){
        this.classList.add('good');
        mount(fb,'<div class="refbox"><span class="t">答对（'+q.score+' 分）</span>'+escapeHtml(q.exp)+'</div>');
        markQuiz(t,qi,q.score);
      }else{
        this.classList.add('bad');
        all[q.a].classList.add('good');
        mount(fb,'<div class="refbox" style="border-left-color:#a8342a;background:#fdf6f4"><span class="t" style="color:#a8342a">答错（0 分）</span>'+escapeHtml(q.exp)+'</div>');
        markQuiz(t,qi,0);
      }
    };
  }
  var refs=document.querySelectorAll('[data-ref]');
  for(var r=0;r<refs.length;r++){
    refs[r].onclick=function(){
      var qi=parseInt(this.getAttribute('data-ref'),10);
      var q=t.quiz[qi];
      var fb=document.getElementById('fb-'+qi);
      var pts='';
      for(var z=0;z<q.points.length;z++){
        pts+='<label class="selfpt"><input type="checkbox" data-pt="'+qi+'-'+z+'">'+escapeHtml(q.points[z])+'</label>';
      }
      mount(fb,'<div class="refbox"><span class="t">参考答案</span>'+escapeHtml(q.ref)+'</div>'
       +'<div class="refbox" style="background:#fbf8f1;border-left-color:#8a6a20"><span class="t" style="color:#8a6a20">按点自评（答出几点给几分）</span>'+pts
       +'<div style="margin-top:8px">本题自评得分：<b id="sp-'+qi+'">0</b> / '+q.score+' 分</div></div>');
      var cbs=fb.querySelectorAll('[data-pt]');
      for(var c=0;c<cbs.length;c++){
        cbs[c].onchange=function(){
          var parts=this.getAttribute('data-pt').split('-');
          var qq=parseInt(parts[0],10);
          var wrap=document.getElementById('fb-'+qq);
          var checked=wrap.querySelectorAll('[data-pt]:checked').length;
          var allN=wrap.querySelectorAll('[data-pt]').length;
          var sc=t.quiz[qq].score;
          var got=Math.round(sc*checked/Math.max(allN,1));
          document.getElementById('sp-'+qq).textContent=got;
          markQuiz(t,qq,got);
        };
      }
    };
  }
  document.getElementById('resetQ').onclick=function(){
    p.quiz=0;save();render();
  };
}

function markQuiz(t,qi,score){
  var p=pg(t.id);
  if(!p._q) p._q={};
  p._q[qi]=score;
  var sum=0;
  for(var k in p._q){if(Object.prototype.hasOwnProperty.call(p._q,k)) sum+=p._q[k];}
  p.quiz=sum;save();
  document.getElementById('qscore').textContent=sum;
}

function findKn(id){
  for(var i=0;i<KN.length;i++) if(KN[i].id===id) return KN[i];
  return null;
}

function findExam(y){
  for(var i=0;i<EXAMS.length;i++) if(EXAMS[i].y===y) return EXAMS[i];
  return null;
}
function examQN(e){
  var n=0;
  for(var i=0;i<e.parts.length;i++){
    var p=e.parts[i];
    if(!p.items) continue;
    for(var k=0;k<p.items.length;k++){
      var it=p.items[k];
      if(it.type==='dict'||it.type==='choice') n++;
    }
  }
  return n;
}
function examP(y){
  if(!store.exam) store.exam={};
  if(!store.exam[y]) store.exam[y]={r:0,w:0,op:0};
  return store.exam[y];
}
function examRecalc(e){
  var p=examP(e.y), r=0, w=0;
  if(p.d){ for(var k in p.d){ if(p.d[k]===1) r++; else w++; } }
  if(p.c){ for(var k2 in p.c){ if(p.c[k2]===1) r++; else w++; } }
  p.r=r; p.w=w;
  save();
  return p;
}

/* ============================================================
   学情诊断：基于本机练习记录自动生成薄弱点报告
   ============================================================ */
function mdKbOf(key){
  var arr=key.split('-'); var mid=arr[0]; var qi=parseInt(arr[1],10);
  for(var i=0;i<MODERN.length;i++){
    if(MODERN[i].id===mid){ var q=MODERN[i].qs[qi]; return (q&&q.kb)?q.kb:null; }
  }
  return null;
}
function kbAggNew(){ return {}; }
function kbAggAdd(a,id,ratio){
  if(!id) return;
  if(!a[id]) a[id]={sum:0,n:0};
  a[id].sum+=ratio; a[id].n++;
}
function renderDiag(){
  var att=0, dictRight=0, dictTotalAtt=0, weakTexts=[], untouched=[], ka=kbAggNew();
  var i,t,p,k;
  for(i=0;i<TEXTS.length;i++){
    t=TEXTS[i];
    p=store.prog[t.id];
    var isAtt=p&&(p.read||(p.dict&&p.dict>0)||(p.quiz&&p.quiz>0));
    if(!isAtt){ untouched.push(t); continue; }
    att++;
    dictTotalAtt+=t.dict.length;
    dictRight+=(p.dict||0);
    if((p.dict||0)<t.dict.length){
      weakTexts.push({t:t, miss:t.dict.length-(p.dict||0), rate:(p.dict||0)/t.dict.length});
    }
    if(p._q){
      for(k in p._q){
        if(!Object.prototype.hasOwnProperty.call(p._q,k)) continue;
        var qi=parseInt(k,10);
        if(!t.quiz[qi]) continue;
        var full=t.quiz[qi].score||1;
        kbAggAdd(ka,kbFor(t,qi),Math.min(1,(p._q[k]||0)/full));
      }
    }
  }
  weakTexts.sort(function(a,b){ return a.rate-b.rate; });
  var mdCount=0;
  for(k in store.md){
    if(!Object.prototype.hasOwnProperty.call(store.md,k)) continue;
    var v=store.md[k];
    var rr=(typeof v==='number')?(v===1?1:0):((v.t&&v.t>0)?(v.s/v.t):0);
    kbAggAdd(ka,mdKbOf(k),rr);
    mdCount++;
  }
  var examAtt=0, examR=0, examW=0;
  for(k in store.exam){
    if(!Object.prototype.hasOwnProperty.call(store.exam,k)) continue;
    var ep=store.exam[k];
    if((ep.r||ep.w||ep.op)>0){ examAtt++; examR+=(ep.r||0); examW+=(ep.w||0); }
  }
  var wrongChars=[];
  for(k in store.wrong){
    if(!Object.prototype.hasOwnProperty.call(store.wrong,k)) continue;
    wrongChars.push({ch:k,n:store.wrong[k].n||0,src:store.wrong[k].src||''});
  }
  wrongChars.sort(function(a,b){ return b.n-a.n; });

  var hasData=(att+mdCount+wrongChars.length)>0;
  var h='<section class="hero"><div><h1>学情诊断 · 我的薄弱点</h1>'
   +'<p>以下报告根据你本页的全部练习记录自动生成：默写正确率、薄弱篇目、高频错字、每个答题公式的得分率，并按优先级排出接下来的补强步骤。练习越多，诊断越准。点「复制报告」发给爸爸，可以一起定下一步计划。</p></div>'
   +'<div class="stat"><div><b>'+att+'/'+TEXTS.length+'</b><span>练过篇目</span></div>'
   +'<div><b>'+wrongChars.length+'</b><span>待清零错字</span></div>'
   +'<div><b>'+mdCount+'</b><span>专练题已判</span></div></div></section>';

  if(!hasData){
    h+='<section class="band"><h2>还没有可诊断的记录</h2>'
     +'<p>先去做几道题：随便挑一篇默写，或到「阅读专练」做两道题，再回到这里，报告就有了。建议第一周的目标：把八上、九上的核心篇目默写各做一遍。</p></section>'
     +'<div class="kbs"><div class="kbc" data-go2="home"><b>去挑一篇开始</b><span>从「古诗文」列表任意点开一篇</span></div></div>';
    mount(app,h);
    var g0=app.querySelectorAll('[data-go2]');
    for(i=0;i<g0.length;i++){
      g0[i].onclick=function(){stopSpeak();view.name=this.getAttribute('data-go2');view.id=null;render();};
    }
    return;
  }

  /* 一、默写 */
  var dictRate=dictTotalAtt>0?Math.round(dictRight*100/dictTotalAtt):0;
  h+='<section class="band"><h2>一、古诗文默写</h2>';
  if(dictTotalAtt>0){
    h+='<div class="diag-bar"><div class="row"><span class="lb">默写正确率</span><div class="tr"><div class="fl '+(dictRate<80?'bad':'')+'" style="width:'+dictRate+'%"></div></div><span class="pc">'+dictRate+'%</span></div></div>';
    h+='<p style="font-size:12.5px;color:var(--muted)">按你已练过的 '+att+' 篇统计：'+dictRight+' / '+dictTotalAtt+' 句全对。'+(dictRate>=95?'正确率很高，保持滚动复习即可。':(dictRate>=80?'主要问题在个别难字，重点清错字本。':'字形记忆还不牢，先集中突破高频错字，再谈速度。'))+'</p>';
  }else{
    h+='<p style="font-size:12.5px;color:var(--muted)">还没有默写记录。默写是深圳中考积累运用部分的送分题，建议今天就从一篇开始。</p>';
  }
  if(weakTexts.length){
    h+='<div style="margin-top:8px"><b style="font-size:13.5px">最需要重默的篇目</b>';
    for(i=0;i<Math.min(5,weakTexts.length);i++){
      var wt=weakTexts[i];
      h+='<div class="diag-step" style="margin:8px 0"><i>'+String.fromCharCode(65+i)+'</i>'
       +'<div><h4>'+escapeHtml(wt.t.title)+'　<span style="font-weight:400;color:var(--muted)">'+escapeHtml(wt.t.vol)+'</span></h4>'
       +'<p>上次默写 '+wt.t.dict.length+' 句错了 '+wt.miss+' 句（正确率 '+Math.round(wt.rate*100)+'%）。点开重默一遍，全对后再听一遍讲解。</p></div></div>';
    }
    h+='</div>';
  }
  h+='</section>';

  /* 二、错字本 */
  h+='<section class="band"><h2>二、错字本 · 高频错字</h2>';
  if(wrongChars.length){
    h+='<p style="font-size:12.5px;color:var(--muted)">错字按出错次数排序（右上角小数字）。深圳默写按字给分，这些字就是你的丢分点；每天睡前刷一遍错字本，清零为止。</p><div>';
    for(i=0;i<Math.min(24,wrongChars.length);i++){
      h+='<span class="wchip">'+escapeHtml(wrongChars[i].ch)+'<small>'+wrongChars[i].n+'</small></span>';
    }
    if(wrongChars.length>24) h+='<span class="chip">……共 '+wrongChars.length+' 字</span>';
    h+='</div><div class="kbs" style="margin-top:10px"><div class="kbc" data-go2="wrong"><b>去错字本清零</b><span>'+wrongChars.length+' 个字等你消灭</span></div></div>';
  }else{
    h+='<p style="font-size:12.5px;color:var(--muted)">暂无错字记录。做了默写之后，写错的字会自动进这里。</p>';
  }
  h+='</section>';

  /* 三、阅读知识点 */
  h+='<section class="band"><h2>三、阅读理解 · 各知识点得分率</h2>';
  var kbList=[];
  for(k in ka){
    if(!Object.prototype.hasOwnProperty.call(ka,k)) continue;
    kbList.push({id:k,val:Math.round(ka[k].sum*100/ka[k].n),n:ka[k].n});
  }
  if(kbList.length){
    h+='<div class="diag-bar">';
    kbList.sort(function(a,b){ return a.val-b.val; });
    for(i=0;i<kbList.length;i++){
      var kn=findKn(kbList[i].id);
      if(!kn) continue;
      h+='<div class="row"><span class="lb">'+escapeHtml(kn.title)+'</span><div class="tr"><div class="fl '+(kbList[i].val<60?'bad':'')+'" style="width:'+kbList[i].val+'%"></div></div><span class="pc">'+kbList[i].val+'%<br>'+kbList[i].n+'题</span></div>';
    }
    h+='</div>';
    var weakKb=[];
    for(i=0;i<kbList.length;i++){ if(kbList[i].n>=2&&kbList[i].val<60) weakKb.push(kbList[i].id); }
    if(weakKb.length){
      h+='<p style="font-size:12.5px;color:var(--muted)">红条（低于 60%）是你还没吃透的答题公式。建议顺序：先把对应公式卡背到能默写，再回做该考点做错过的题，对照采分点找差距。</p><div class="kbs">';
      for(i=0;i<weakKb.length;i++){
        var wk=findKn(weakKb[i]);
        if(wk) h+='<div class="kbc" data-kb="'+wk.id+'"><b>先补：'+escapeHtml(wk.title)+'</b><span>'+escapeHtml(wk.w)+'</span></div>';
      }
      h+='</div>';
    }else{
      h+='<p style="font-size:12.5px;color:var(--muted)">暂无低于 60% 的知识点。继续把练习量铺开，至少每个公式做过 3 道题，数据才有参考价值。</p>';
    }
  }else{
    h+='<p style="font-size:12.5px;color:var(--muted)">还没有阅读题记录。到「阅读专练」做题后，这里会显示每个答题公式的得分率——这是定位“为什么丢分”最直接的工具。</p>';
    h+='<div class="kbs"><div class="kbc" data-go2="modern"><b>去阅读专练做题</b><span>四类文体 15 题</span></div></div>';
  }
  h+='</section>';

  /* 四、真题 */
  h+='<section class="band"><h2>四、真题实战</h2>';
  if(examAtt>0){
    var tot2=examR+examW;
    var er=Math.round(examR*100/tot2);
    h+='<div class="diag-bar"><div class="row"><span class="lb">三年卷判分正确率</span><div class="tr"><div class="fl '+(er<70?'bad':'')+'" style="width:'+er+'%"></div></div><span class="pc">'+er+'%</span></div></div>';
    h+='<p style="font-size:12.5px;color:var(--muted)">已判 '+tot2+' 个判分点（默写与选择题）。真题是最好的镜子：低于 70%，说明基础题还有丢分，优先回补默写与实词。</p>';
    h+='<div class="kbs"><div class="kbc" data-go2="exam"><b>回到真题实战</b><span>从判错最多的那一年重做</span></div></div>';
  }else{
    h+='<p style="font-size:12.5px;color:var(--muted)">还没做过真题。不用怕做不好——2025 卷的默写和文言文先做一遍，做完看讲析，你就知道中考的“深浅”了。</p>';
    h+='<div class="kbs"><div class="kbc" data-go2="exam"><b>先做 2025 卷默写</b><span>七道默写逐空判分</span></div></div>';
  }
  h+='</section>';

  /* 五、行动步骤 */
  h+='<section class="band"><h2>五、这一周按这个顺序补</h2>';
  var step=0;
  var dq2=String.fromCharCode(34);
  function stepHtml(title,body,go){
    step++;
    var chip='';
    if(go){
      chip='<p style=margin-top:6px><span class=kbc data-go2='+dq2+go+dq2+'>现在就去 →</span></p>';
    }
    return '<div class=diag-step><i>'+step+'</i><div><h4>'+title+'</h4><p>'+body+'</p>'+chip+'</div></div>';
  }
  if(wrongChars.length) h+=stepHtml('错字清零（每天 5 分钟）',wrongChars.length+' 个错字，睡前刷一遍错字本，第二天默写遇到它们刻意放慢。目标：两周内清零。','wrong');
  if(weakTexts.length){
    var wnames=[];
    for(i=0;i<Math.min(3,weakTexts.length);i++){ wnames.push(weakTexts[i].t.title); }
    h+=stepHtml('重默最薄弱的 '+wnames.length+' 篇','「'+wnames.join('」「')+'」——重默一遍，全对为止，再点“讲读·点睛”听一遍加深理解。',null);
  }
  var wkb=[];
  if(typeof weakKb!=='undefined'){ wkb=weakKb; }
  if(wkb.length){
    var wkt=[];
    for(i=0;i<wkb.length;i++){ var knn=findKn(wkb[i]); if(knn) wkt.push(knn.title); }
    h+=stepHtml('补答题公式（每周 2 条）','得分率低于 60% 的公式：'+wkt.join('、')+'。先把公式卡的“套用句式”背熟，再回做该考点做错的题，对照采分点找差距。','kn');
  }
  if(mdCount<8) h+=stepHtml('阅读专练至少做 8 题','你的阅读题练习量还不足（目前 '+mdCount+' 题）。四种文体各做 2 题，做完按采分点自评并点“确认自评”，诊断才会更准。','modern');
  if(examAtt===0) h+=stepHtml('做一次 2025 深圳真题','先只做默写 7 题和文言文对比阅读——感受一下真题的难度和出题方式，做完看逐题讲析。','exam');
  if(untouched.length>30) h+=stepHtml('把练习量铺开','还有 '+untouched.length+' 篇完全没动过。深圳卷默写以七八年级篇目为主，建议从八上（三峡、记承天寺夜游、黄鹤楼、使至塞上）开始，每天 1–2 篇。','home');
  if(step===0) h+='<p style="font-size:12.5px;color:var(--muted)">各板块完成得都不错。保持节奏：每周一次错字清零 + 2 道阅读题 + 半份真题卷。</p>';
  h+='<div style="margin-top:14px"><button type="button" class="btn primary" id="copyDiag">复制报告发给爸爸</button></div>';
  h+='</section>';

  h+='<div class="foot">诊断只统计本机本页的练习记录；切换浏览器或清除缓存会丢失。建议每周日晚看一次。</div>';
  mount(app,h);
  var cp=document.getElementById('copyDiag');
  if(cp){
    cp.onclick=function(){
      var lines=[];
      lines.push('【语萱 · 语文练习学情报告】（本页自动生成）');
      lines.push('');
      lines.push('一、总体：练过篇目 '+att+'/'+TEXTS.length+'，专练判分 '+mdCount+' 题，待清零错字 '+wrongChars.length+' 个。');
      if(dictTotalAtt>0) lines.push('二、默写正确率：'+dictRate+'%（'+dictRight+'/'+dictTotalAtt+' 句）。');
      if(weakTexts.length){
        var wn2=[];
        for(var w=0;w<Math.min(3,weakTexts.length);w++){ wn2.push(weakTexts[w].t.title); }
        lines.push('三、最薄弱篇目：'+wn2.join('、')+'。');
      }
      if(wrongChars.length){
        var wc2=[];
        for(var c2=0;c2<Math.min(8,wrongChars.length);c2++){ wc2.push(wrongChars[c2].ch+'('+wrongChars[c2].n+'次)'); }
        lines.push('四、高频错字：'+wc2.join(' ')+'。');
      }
      if(kbList.length){
        var kl2=[];
        for(var kk=0;kk<kbList.length;kk++){ var kn2=findKn(kbList[kk].id); if(kn2) kl2.push(kn2.title+kbList[kk].val+'%'); }
        lines.push('五、阅读知识点得分率：'+kl2.join('、')+'。');
      }
      if(examAtt>0) lines.push('六、真题判分正确率：'+examR+' 题判对，'+examW+' 题判错（共 '+(examR+examW)+' 个判分点）。');
      var txt=lines.join('\n');
      var done=function(){ mount(cp,'已复制到剪贴板，去微信粘贴给爸爸吧'); };
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ window.prompt('长按复制以下报告：',txt); }); }
        else{ window.prompt('长按复制以下报告：',txt); }
      }catch(e){ window.prompt('长按复制以下报告：',txt); }
    };
  }
  var kbs=app.querySelectorAll('[data-kb]');
  for(i=0;i<kbs.length;i++){
    kbs[i].onclick=function(){
      var kid=this.getAttribute('data-kb');
      stopSpeak();view.name='kn';view.id=null;render();
      var el=document.getElementById('kn-'+kid);
      if(el){try{el.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}}
    };
  }
  var g2=app.querySelectorAll('[data-go2]');
  for(var j=0;j<g2.length;j++){
    g2[j].onclick=function(){stopSpeak();view.name=this.getAttribute('data-go2');view.id=null;render();};
  }
}

/* ============================================================
   实词擂台：题库随机化
   每轮从题库随机抽 10 题，题目顺序洗牌，ABCD 选项也洗牌，
   防止背"第 3 题选 B"这种位置答案
   ============================================================ */
function shuffleArr(a){
  var arr=a.slice();
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
var wRound=null;
function newWordRound(){
  var n=Math.min(10,WORDS.length);
  var pool=shuffleArr(WORDS).slice(0,n);
  wRound=[];
  for(var i=0;i<pool.length;i++){
    var w=pool[i];
    var idxs=[];
    for(var k=0;k<w.opts.length;k++) idxs.push(k);
    var order=shuffleArr(idxs);
    var opts=[],na=0;
    for(var m=0;m<order.length;m++){
      opts.push(w.opts[order[m]]);
      if(order[m]===w.a) na=m;
    }
    wRound.push({q:w.q,opts:opts,a:na,exp:w.exp,src:w.src||''});
  }
}
function renderWords(){
  var best=Math.min(store.wordsBest||0,10);
  var h='<section class="hero"><div><h1>实词擂台</h1>'
   +'<p>深圳卷文言考课内外对比，课外篇目全靠实词迁移。题库共 '+WORDS.length+' 题（全部出自本站收录篇目，词义按教材注释），<b>每轮随机抽 10 题，选项顺序也随机打乱</b>——刷到连续两轮全对为止。</p></div>'
   +'<div class="stat"><div><b>'+best+'/10</b><span>最高分</span></div><div><b>'+WORDS.length+'</b><span>题库总量</span></div></div></section><div id="wpanel"></div>';
  mount(app,h);
  newWordRound();
  drawWords(0,0);
}

function drawWords(idx,score){
  var wp=document.getElementById('wpanel');
  if(idx>=wRound.length){
    if(score>(store.wordsBest||0)){store.wordsBest=score;save();}
    var line=score>=10?'满分！明天再来一轮——题库是随机抽的，换一批再验。':(score>=8?'很稳，错的那几个就是你的盲点，点篇目名回原文再读一遍。':'先回原文精读，把注释里的实词过一遍再来。');
    var h='<div class="q"><div class="qh"><span class="no">本轮结束</span><span class="ask">答对 '+score+' / '+wRound.length+' 题</span></div>'
     +'<p style="font-size:13.5px;line-height:1.9">'+line
     +'</p><div class="pbar" style="margin-top:12px"><button type="button" class="btn primary" id="again">再来一组（重新随机）</button></div></div>';
    mount(wp,h);
    document.getElementById('again').onclick=function(){newWordRound();drawWords(0,0);};
    return;
  }
  var w=wRound[idx];
  var h='<div class="bar"><div class="sc">'+score+'<small> / '+wRound.length+' 已答对</small></div><div class="grow"></div>'
   +'<span style="font-size:12px;color:#7b7469">第 '+(idx+1)+' 题 · 随机抽自题库</span></div>'
   +'<div class="q"><div class="qh"><span class="no">第 '+(idx+1)+' 题</span>'
   +(w.src?'<span class="kb">出自 · '+escapeHtml(w.src)+'</span>':'')
   +'<span class="ask">'+escapeHtml(w.q)+'</span></div>';
  for(var o=0;o<w.opts.length;o++){
    h+='<button type="button" class="opt" data-wo="'+o+'"><span class="k">'+String.fromCharCode(65+o)+'．</span>'+escapeHtml(w.opts[o])+'</button>';
  }
  h+='<div id="wfb"></div></div>';
  mount(wp,h);
  var os=wp.querySelectorAll('[data-wo]');
  for(var i=0;i<os.length;i++){
    os[i].onclick=function(){
      var oi=parseInt(this.getAttribute('data-wo'),10);
      var all=wp.querySelectorAll('[data-wo]');
      for(var z=0;z<all.length;z++){all[z].disabled=true;}
      var add=0;
      if(oi===w.a){this.classList.add('good');add=1;}
      else{this.classList.add('bad');all[w.a].classList.add('good');}
      mount(document.getElementById('wfb'),'<div class="refbox"><span class="t">'+(add?'答对':'答错')+'</span>'+escapeHtml(w.exp)+'</div>'
       +'<div class="pbar" style="margin-top:12px"><button type="button" class="btn primary" id="nextW">下一题</button></div>');
      document.getElementById('nextW').onclick=function(){drawWords(idx+1,score+add);};
    };
  }
}

function renderWrong(){
  var keys=Object.keys(store.wrong);
  var h='<section class="hero"><div><h1>错字本</h1>'
   +'<p>默写判分时写错的字会自动记在这里，按出错次数排序。中考默写扣分只扣字，不扣标点——这个本子就是你的提分清单。</p></div>'
   +'<div class="stat"><div><b>'+keys.length+'</b><span>个字</span></div></div></section>';
  if(!keys.length){
    h+='<div class="empty">还没有错字。先去「默写自测」做一轮。</div>';
    mount(app,h);return;
  }
  keys.sort(function(a,b){return (store.wrong[b].n||0)-(store.wrong[a].n||0);});
  h+='<div class="wgrid">';
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    h+='<div class="wcell"><b class="serif">'+escapeHtml(k)+'</b><span>错 '+(store.wrong[k].n||1)+' 次</span>'
     +'<span style="display:block;font-size:10.5px;color:#a9a29a">'+escapeHtml(store.wrong[k].src||'')+'</span></div>';
  }
  h+='</div>';
  h+='<div class="pbar" style="margin-top:20px"><button type="button" class="btn" id="exportW">复制清单</button>'
   +'<button type="button" class="btn ghost" id="clearW">清空（需确认）</button></div><div id="cp"></div>';
  mount(app,h);
  document.getElementById('exportW').onclick=function(){
    var s='';
    for(var i=0;i<keys.length;i++) s+=keys[i]+'　';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(function(){
        mount(document.getElementById('cp'),'<div class="hint">已复制：'+escapeHtml(s)+'</div>');
      }).catch(function(){
        mount(document.getElementById('cp'),'<div class="hint">复制失败，请手动抄写：'+escapeHtml(s)+'</div>');
      });
    }else{
      mount(document.getElementById('cp'),'<div class="hint">请手动抄写：'+escapeHtml(s)+'</div>');
    }
  };
  document.getElementById('clearW').onclick=function(){
    if(confirm('确定清空所有错字记录？此操作不可撤销。')){
      store.wrong={};save();render();
    }
  };
}

function render(){
  setNav();
  if(view.name==='home') renderHome();
  else if(view.name==='text') renderText();
  else if(view.name==='kn') renderKn();
  else if(view.name==='modern') renderModern();
  else if(view.name==='exam') renderExam();
  else if(view.name==='examY') renderExamY();
  else if(view.name==='diag') renderDiag();
  else if(view.name==='words') renderWords();
  else if(view.name==='wrong') renderWrong();
}

render();
</script>
